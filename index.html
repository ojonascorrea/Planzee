<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>Planzee - Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="dashboard-container">
      <div class="dashboard-card">
        <div class="header-container">
          <h1>Planzee</h1>
          <button id="theme-toggle">🌙 Alternar Tema</button>
        </div>
        <div class="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p id="progress-text">0 de 0 tarefas concluídas</p>
        <div class="chart-container">
          <h2>Produtividade da Semana</h2>
          <canvas id="productivity-chart" width="400" height="200"></canvas>
        </div>
        <div class="category-filters-container">
          <h3>Filtrar por Categoria</h3>
          <div id="category-filters">
            <select id="category-select" class="category-select">
              <option value="all">Todas as categorias</option>
            </select>
          </div>
          <div id="period-filters">
            <button class="period-btn" data-period="dia">Hoje 📅</button>
            <button class="period-btn" data-period="semana">Semana 📆</button>
            <button class="period-btn" data-period="mes">Mês 🗓️</button>
          </div>          
        </div>
        
      </div>
    </div>

    <div class="tasks-container">
      <form id="task-form">
        <input type="text" id="task-title" placeholder="Nome da tarefa" required>
        <input type="date" id="task-date" required>
        <input type="time" id="task-time" required>
         
        <select id="task-priority" required class="badge_priority">
          <option value="alta">Alta Prioridade 🔥</option>
          <option value="media" selected>Média Prioridade 📝</option>
          <option value="baixa">Baixa Prioridade 💤</option>
        </select>

        <div class="category-container">
          <input type="text" id="task-category" placeholder="Digite a categoria (opcional)" class="category-input">
        </div>

        <button type="submit">Adicionar</button>
      </form>
        
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="pending">Pendentes</button>
        <button class="filter-btn" data-filter="completed">Concluídas</button>
      </div>
      <div class="search-container">
        <input type="text" id="search-input" placeholder="Buscar tarefas..." />
        <button id="sort-by-date-btn">Organizar por Data 📅</button>
      </div>

      <ul id="task-list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
