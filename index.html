<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>Planzee - Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="dashboard-container">
      <div class="dashboard-card">
        <div class="header-container">
          <h1>Planzee</h1>
          <div class="header-actions">
            <a href="tags.html" class="tags-link">Gerenciar Etiquetas 🏷️</a>
            <button id="theme-toggle">🌙 Alternar Tema</button>
          </div>
        </div>
        <div class="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p id="progress-text">0 de 0 tarefas concluídas</p>
        <div class="chart-container">
          <h2>Produtividade da Semana</h2>
          <canvas id="productivity-chart" width="400" height="200"></canvas>
        </div>
        <div class="category-filters-container">
          <h3>Filtrar por Categoria</h3>
          <div id="category-filters">
            <select id="category-select" class="category-select">
              <option value="all">Todas as categorias</option>
            </select>
            <select id="tag-select" class="category-select">
              <option value="all">Todas as etiquetas</option>
            </select>
          </div>
          <div id="period-filters">
            <button class="period-btn" data-period="dia">Hoje 📅</button>
            <button class="period-btn" data-period="semana">Semana 📆</button>
            <button class="period-btn" data-period="mes">Mês 🗓️</button>
          </div>          
        </div>
        
      </div>
    </div>

    <div class="tasks-container">
      <form id="task-form">
        <input type="text" id="task-title" placeholder="Nome da tarefa" required>
        <div class="input-group">
          <input type="date" id="task-date" required>
          <input type="time" id="task-time" required>
          <select id="task-priority" required class="badge_priority">
            <option value="alta">Alta Prioridade 🔥</option>
            <option value="media" selected>Média Prioridade 📝</option>
            <option value="baixa">Baixa Prioridade 💤</option>
          </select>
        </div>
         
        <div class="category-container">
          <input type="text" id="task-category" placeholder="Digite a categoria (opcional)" class="category-input">
        </div>

        <button type="submit">Adicionar</button>
      </form>
        
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="pending">Pendentes</button>
        <button class="filter-btn" data-filter="completed">Concluídas</button>
      </div>
      <div class="search-container">
        <input type="text" id="search-input" placeholder="Buscar tarefas..." />
        <button id="sort-by-date-btn">Organizar por Data 📅</button>
      </div>

      <ul id="task-list"></ul>
    </div>
  </div>

  <!-- Modal de Edição -->
  <div id="edit-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Editar Tarefa</h3>
        <button class="modal-close">&times;</button>
      </div>
      <form id="edit-modal-form" class="modal-form">
        <div class="form-group">
          <label for="edit-title-modal">Título da Tarefa</label>
          <input type="text" id="edit-title-modal" required>
        </div>
        <div class="form-group datetime-priority-group">
          <input type="date" id="edit-date-modal" required>
          <input type="time" id="edit-time-modal" required>
          <select id="edit-priority-modal" required>
            <option value="alta">Alta Prioridade 🔥</option>
            <option value="media">Média Prioridade 📝</option>
            <option value="baixa">Baixa Prioridade 💤</option>
          </select>
        </div>
        <div class="form-group">
          <label for="edit-category-modal">Categoria</label>
          <input type="text" id="edit-category-modal" placeholder="Digite a categoria (opcional)">
        </div>
        <div class="modal-actions">
          <button type="submit" class="save-btn">Salvar Alterações</button>
          <button type="button" class="cancel-btn">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
